<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; manifest-src data:; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D131B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="かぎ箱">
<meta name="description" content="この端末の中だけに暗号化して保管するパスワード帳">
<title>かぎ箱</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --bg:#F2F3F5;--surface:#FFFFFF;--surface-2:#F6F7F9;--ink:#18222F;--muted:#5F6B7C;--line:#E1E4EA;
  --ai:#1F3A5F;--ai-ink:#1F4C80;--ai-soft:#E6EEF8;
  --brass:#8C6320;--brass-btn:#8C6320;--brass-soft:#F6EEDD;--on-brass:#FFFFFF;
  --danger:#B42318;--danger-soft:#FCEBE9;--ok:#2F7D4F;--warn:#8A5A00;--warn-soft:#FFF3D6;
  --shadow:0 12px 32px rgba(24,34,47,.16);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0D131B;--surface:#151E29;--surface-2:#1B2633;--ink:#E6EBF2;--muted:#93A1B4;--line:#26344A;
  --ai:#2D5082;--ai-ink:#9DC0EC;--ai-soft:#1B2C42;
  --brass:#DDB263;--brass-btn:#D6A74F;--brass-soft:#2B2416;--on-brass:#1B1305;
  --danger:#F28B80;--danger-soft:#3A1D1B;--ok:#6CC592;--warn:#E6BA55;--warn-soft:#322912;
  --shadow:0 12px 32px rgba(0,0,0,.55);
}}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none}
input,textarea{font:inherit;color:inherit;margin:0}
a{color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ai-ink);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor}
.mono{font-family:var(--mono)!important;letter-spacing:.03em}

/* ---------- 入口（作成・ロック） ---------- */
.gate{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 22px calc(28px + env(safe-area-inset-bottom));text-align:center}
.emblem{width:108px;height:108px;margin-bottom:16px}
.emblem svg{width:100%;height:100%;display:block}
.em-bg{fill:#1F3A5F}
.em-ring{fill:none;stroke:rgba(255,255,255,.08);stroke-width:14}
.em-key{transform-origin:256px 256px;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.emblem.turn .em-key{transform:rotate(90deg)}
.gate-title{font-size:27px;letter-spacing:.14em;margin:0 0 4px;font-weight:700;padding-left:.14em}
.gate-lead{color:var(--muted);max-width:26em;margin:0 0 22px;font-size:14.5px}
.gate-form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;text-align:left}
.bio-btn .ic{width:24px;height:24px;stroke-width:1.7}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:4px 0 -2px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{margin-top:22px;color:var(--muted);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;padding:8px}
.caution{display:flex;gap:10px;background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.65}
.caution .ic{color:var(--warn);margin-top:2px}
.caution p{margin:0}
.hint{margin:-4px 0 0;font-size:13px;color:var(--danger);min-height:1.2em}
.hint.ok{color:var(--ok)}
.err{margin:0;font-size:13.5px;color:var(--danger);min-height:1.3em}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- 入力 ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field-label{font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.req{font-size:11px;color:var(--danger);font-weight:600}
.inp,.pw-wrap{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;transition:border-color .15s}
.inp{padding:12px 14px;font-size:16px;display:block}
textarea.inp{resize:vertical;min-height:84px;line-height:1.6}
.inp:focus,.pw-wrap:focus-within{border-color:var(--ai-ink)}
.inp:focus-visible,.pw-wrap input:focus-visible,.search input:focus-visible{outline:none}
.inp.invalid{border-color:var(--danger)}
.pw-wrap{display:flex;align-items:center;padding-right:4px}
.pw-wrap input{flex:1;min-width:0;border:0;background:transparent;padding:12px 4px 12px 14px;font-size:16px;font-family:var(--mono);letter-spacing:.03em}
.eye{width:44px;height:44px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.gen-btn{height:38px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;background:var(--brass-soft);color:var(--brass);font-weight:700;font-size:14px;margin-left:2px}
.meter{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
.meter .track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter .track span{display:block;height:100%;width:0;border-radius:3px;transition:width .25s,background-color .25s}
.meter em{font-style:normal;font-size:12px;color:var(--muted);min-width:5.5em;text-align:right}
.meter.s0 span{background:#C8372D}.meter.s1 span{background:#D9822B}.meter.s2 span{background:#C2A01E}.meter.s3 span{background:#3B9160}.meter.s4 span{background:#2C6FB0}
.meter.s0 em{color:var(--danger)}

/* ---------- ボタン ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border-radius:14px;font-weight:600;font-size:15px;white-space:nowrap;transition:transform .1s}
.btn.primary{background:var(--ai);color:#fff}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line)}
.btn.danger{color:var(--danger)}
.btn.primary.danger{background:#B42318;color:#fff}
.btn.big{height:54px;font-size:16px;border-radius:16px}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.sq{flex:none!important;width:52px;padding:0}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled){transform:scale(.97)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.icon-btn:active{background:var(--surface-2)}

/* ---------- 一覧 ---------- */
.shell{max-width:680px;margin:0 auto;min-height:100dvh;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:env(safe-area-inset-top) 16px 0}
.bar{display:flex;align-items:center;gap:4px;height:56px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .emblem{width:32px;height:32px;margin:0}
.brand b{font-size:19px;letter-spacing:.1em}
.brand small{color:var(--muted);font-size:13px}
.lock-btn{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 12px;border-radius:20px;background:var(--ai);color:#fff;font-weight:600;font-size:14px;margin-left:4px}
.lock-btn .ic{width:18px;height:18px}
.searchrow{display:flex;gap:8px;align-items:center}
.search{flex:1;display:flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding-left:12px;height:48px;min-width:0}
.search:focus-within{border-color:var(--ai-ink)}
.search>.ic{color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;height:100%;padding:0 4px}
.search input::-webkit-search-cancel-button{display:none}
.sortbtn{height:48px;padding:0 12px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:17px;background:var(--surface);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.chip .ic{width:15px;height:15px}
.chip i{font-style:normal;font-size:12px;color:var(--muted)}
.chip.on{background:var(--ai);border-color:var(--ai);color:#fff}
.chip.on i{color:rgba(255,255,255,.72)}
.chip.fav .ic{color:var(--brass)}
.chip.fav.on .ic{color:#F2CD80}
.chip.review:not(.on){background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.sm{height:32px;font-size:13px}

.list{list-style:none;margin:2px 16px 0;padding:0;background:var(--surface);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:2px;padding-right:8px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,30%{background:var(--brass-soft)}100%{background:transparent}}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:11px 6px 11px 14px;text-align:left;min-height:66px}
.row-main:active{background:var(--surface-2)}
.av{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:17px;background:hsl(var(--h) 42% 91%);color:hsl(var(--h) 48% 29%)}
@media (prefers-color-scheme:dark){.av{background:hsl(var(--h) 28% 23%);color:hsl(var(--h) 62% 80%)}}
.av.lg{width:54px;height:54px;border-radius:16px;font-size:23px}
.row-text{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.35}
.row-text b{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.row-text b .ic{width:14px;height:14px;color:var(--brass)}
.row-text small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.why{display:inline-flex;gap:4px;margin-top:4px}
.why span{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:1px 6px}
.cp{flex:none;width:50px;height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;font-weight:700;color:var(--muted);transition:background-color .15s,color .15s}
.cp .ic{width:19px;height:19px}
.cp:active{background:var(--surface-2)}
.cp.pw{color:var(--ai-ink);background:var(--ai-soft);margin-left:4px}
.cp.done,.cpy.done{color:var(--ok)!important}
.cp.pw.done{background:rgba(47,125,79,.12)}

.banner{margin:0 16px 12px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--brass-soft);font-size:13.5px;line-height:1.6}
.banner>.ic{color:var(--brass)}
.banner p{flex:1;min-width:14em;margin:0}
.banner div{display:flex;gap:8px;margin-left:auto}

.empty{text-align:center;padding:40px 24px 20px;max-width:420px;margin:0 auto}
.empty .emblem{width:76px;height:76px;margin:0 auto 14px;opacity:.95}
.empty h2{font-size:18px;margin:0 0 6px}
.empty p{color:var(--muted);font-size:14px;margin:0 0 20px}
.empty .btns{display:flex;flex-direction:column;gap:10px}
.empty .tip{margin-top:22px;font-size:13px;color:var(--muted)}
.nohit{text-align:center;padding:36px 20px;color:var(--muted)}
.nohit .btn{margin-top:14px}

.fab{position:fixed;right:max(18px, calc(50vw - 322px));bottom:calc(18px + env(safe-area-inset-bottom));height:58px;padding:0 24px 0 18px;border-radius:29px;background:var(--brass-btn);color:var(--on-brass);display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;box-shadow:var(--shadow);z-index:6}
.fab .ic{width:22px;height:22px;stroke-width:2.2}
.fab:active{transform:scale(.97)}

/* ---------- シート ---------- */
.sheet{position:fixed;inset:0;z-index:20;pointer-events:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(9,14,22,.46);opacity:0;transition:opacity .22s}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:94dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.85,.25,1);box-shadow:var(--shadow)}
.sheet.open{pointer-events:auto}
.sheet.open .sheet-backdrop{opacity:1}
.sheet.open .sheet-panel{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet-body{overflow-y:auto;padding:4px 20px 0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
@media (min-width:760px){
  .sheet-panel{bottom:auto;top:50%;border-radius:22px;max-height:88dvh;transform:translateY(-46%);opacity:0;transition:transform .25s,opacity .2s;width:560px}
  .sheet.open .sheet-panel{transform:translateY(-50%);opacity:1}
  .grab{display:none}
  .sheet-body{padding-top:14px}
}
.d-head{display:flex;align-items:center;gap:12px;padding:8px 0 16px}
.d-title{flex:1;min-width:0}
.d-title h2,.e-title{margin:0;font-size:20px;line-height:1.35;word-break:break-word}
.e-title{flex:1}
.d-url{display:inline-flex;align-items:center;gap:4px;color:var(--ai-ink);font-size:14px;text-decoration:none;max-width:100%;padding:2px 0}
.d-url span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-url .ic{width:15px;height:15px}
.fields{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.frow{display:flex;align-items:center;gap:6px;padding:10px 8px 10px 14px;border-top:1px solid var(--line);min-height:66px}
.frow:first-child{border-top:0}
.fbody{flex:1;min-width:0}
.fk{font-size:12px;color:var(--muted);font-weight:600}
.fv{font-size:16px;word-break:break-all;line-height:1.5}
.fv.empty,.empty-v{color:var(--muted);font-size:14px}
.pwv{font-family:var(--mono);font-size:18px;letter-spacing:.05em}
.pwrow .meter{margin-top:6px}
.cpy{flex:none;height:42px;padding:0 13px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.cpy .ic{width:18px;height:18px}
.cpy.main{background:var(--ai);border-color:var(--ai);color:#fff}
.cpy.main.done{background:var(--ok);border-color:var(--ok);color:#fff!important}
.pwc .d{color:var(--ai-ink)}
.pwc .s{color:var(--brass)}
.pwc .u{font-weight:700}
.warnline{display:flex;gap:8px;align-items:flex-start;background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:12px;font-size:13.5px;margin:10px 0 0;line-height:1.55}
.warnline .ic{width:17px;height:17px;margin-top:2px}
.note-box{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.note-box .fk{display:flex;justify-content:space-between;align-items:center}
.note-box p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-size:15px}
.mini-copy{font-size:12.5px;font-weight:600;color:var(--ai-ink);padding:4px 6px}
.meta{margin:14px 0 0;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;color:var(--muted)}
.tag{display:inline-flex;height:24px;align-items:center;padding:0 10px;border-radius:12px;background:var(--ai-soft);color:var(--ai-ink);font-weight:600;font-size:12.5px}
.hist{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:0 14px}
.hist summary{cursor:pointer;padding:12px 0;font-size:14px;color:var(--muted);font-weight:600;list-style-position:inside}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.hrow code{flex:1;min-width:0;font-family:var(--mono);font-size:14px;word-break:break-all}
.hrow small{color:var(--muted);font-size:12px;white-space:nowrap}
.d-actions{position:sticky;bottom:0;display:flex;gap:8px;padding:14px 0 calc(14px + env(safe-area-inset-bottom));margin-top:18px;background:var(--surface);border-top:1px solid var(--line)}
.d-actions .btn{flex:1}
.d-actions .btn.sq .ic.fill{color:var(--brass)}

.form{display:flex;flex-direction:column;gap:16px}
.catpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.gen{margin-top:10px;background:var(--brass-soft);border-radius:16px;padding:14px}
.gen-out{background:var(--surface);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:19px;letter-spacing:.05em;word-break:break-all;line-height:1.5;min-height:54px}
.gen-len{display:flex;align-items:center;gap:12px;margin:12px 0 8px;font-size:14px}
.gen-len input{flex:1;accent-color:var(--ai-ink);height:32px}
.gen-len b{min-width:2.2em;text-align:right;font-size:16px}
.gen-opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0}
.opt span{display:inline-flex;align-items:center;height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;cursor:pointer}
.opt input:checked+span{background:var(--ai);border-color:var(--ai);color:#fff}
.opt input:focus-visible+span{outline:2px solid var(--ai-ink);outline-offset:2px}
.gen-help{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.gen-actions{display:flex;gap:8px;margin-top:12px}
.gen-actions .btn{flex:1}
.switch{display:flex;align-items:center;gap:12px;font-size:15px;cursor:pointer;min-height:44px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked+.sw{background:var(--brass-btn)}
.switch input:checked+.sw::after{transform:translateX(20px)}
.switch input:focus-visible+.sw{outline:2px solid var(--ai-ink);outline-offset:2px}

.set{margin-bottom:24px}
.set-switch{background:var(--surface-2);border-radius:14px;padding:10px 14px;margin-bottom:4px;min-height:60px}
.set-switch>.ic{color:var(--ai-ink)}
.sw-text{flex:1;display:flex;flex-direction:column;line-height:1.45}
.sw-text small{color:var(--muted);font-size:12.5px}
.switch input:disabled~.sw{opacity:.4}
.set h3{font-size:14px;color:var(--muted);margin:0 0 8px;font-weight:700}
.set-label{font-size:14px;margin:12px 0 8px}
.set-note{font-size:13px;color:var(--muted);margin:6px 0 0;line-height:1.7}
.set-status{font-size:14px;font-weight:600;margin:10px 0 0}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:40px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.14);font-weight:700;color:var(--ai-ink)}
.set-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 12px 10px 14px;border-radius:14px;background:var(--surface-2);margin-top:8px;text-align:left;font-size:15px}
.set-row>span{flex:1;min-width:0;display:flex;flex-direction:column}
.set-row small{color:var(--muted);font-size:12.5px;line-height:1.5}
.set-row>.ic:first-child{color:var(--ai-ink)}
.set-row>.ic:last-child{color:var(--muted);width:16px}
.set-row.danger,.set-row.danger>.ic:first-child{color:var(--danger)}
.facts{margin:0;padding-left:1.2em;font-size:13.5px;line-height:1.75}
.facts li{margin-bottom:4px}
.sheet-end{height:calc(20px + env(safe-area-inset-bottom))}

/* ---------- ダイアログ・トースト ---------- */
.dlg{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px}
.dlg-backdrop{position:absolute;inset:0;background:rgba(9,14,22,.52)}
.dlg-panel{position:relative;width:100%;max-width:380px;background:var(--surface);border-radius:22px;padding:22px 20px 16px;box-shadow:var(--shadow);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.dlg-panel h3{margin:0 0 8px;font-size:18px;line-height:1.45;word-break:break-word}
.dlg-panel p{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.7}
.dlg-panel p b{color:var(--ink)}
.dlg-panel .inp,.dlg-panel .pw-wrap{margin-bottom:6px}
.dlg-btns{display:flex;gap:8px;margin-top:8px}
.dlg-btns .btn{flex:1;padding:0 10px}
.toasts{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;max-width:440px;width:100%;display:flex;align-items:center;gap:12px;background:#1C2635;color:#fff;border-radius:15px;padding:12px 12px 12px 16px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.07);opacity:0;transform:translateY(10px);transition:opacity .2s,transform .2s}
.toast.in{opacity:1;transform:none}
.toast.out{opacity:0;transform:translateY(6px)}
.toast .ic{color:#8FD3A8}
.toast.warn .ic{color:#F2CD80}.toast.error{background:#7A1E16}.toast.error .ic{color:#FFB4AB}
.t-msg{flex:1;display:flex;flex-direction:column;line-height:1.45;font-size:14.5px}
.t-msg small{opacity:.72;font-size:12px;margin-top:1px}
.t-act{color:#F2CD80;font-weight:700;padding:8px 10px;border-radius:8px;font-size:14px}

body.veil #app,body.veil .sheet-panel{filter:blur(18px)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ---------- アプリアイコン・マニフェスト（すべてこのファイル内で生成） ---------- */

/* ---------- 小道具 ---------- */
const b64 = buf => { const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); };

function safeUrl(u) {

/* ---------- 暗号 ---------- */
async function deriveKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:iter, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt', 'decrypt']);

  return { iv: b64(iv), ct: b64(ct) };

const rand = n => crypto.getRandomValues(new Uint8Array(n));

/* 金庫の鍵（ランダム）を、マスターパスワードと指紋の2通りで包んでおく */

// 保存データ・バックアップをマスターパスワードで開く（旧形式 v1 は自動で新形式へ）

async function bioSupported() {

const pwField = (id, label, ph = '', ac = 'off') => `<label class="field"><span class="field-label">${label}</span><span class="pw-wrap"><input id="${id}" type="password" autocomplete="${ac}" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${esc(ph)}"><button type="button" class="eye" data-eye="${id}" aria-label="表示する">${ic('eye')}</button></span></label>`;

const S = { key:null, salt:null, iter:ITER, wrapPw:null, bio:null, data:null, q:'', filter:'all', hold:0 };
let lastAct = Date.now(), clipTimer = null, clipPending = false, saveChain = Promise.resolve(), waitTimer = null;
const GEN_DEFAULT = { len:16, upper:true, lower:true, digit:true, symbol:true, noAmb:true };
function withDefaults(d) {
  d = d && typeof d === 'object' ? d : {};
  d.items = Array.isArray(d.items) ? d.items.filter(i => i && i.id) : [];
  d.settings = Object.assign({ autolock:5, clip:30, sort:'recent', snooze:0 }, d.settings || {});
  d.settings.gen = Object.assign({}, GEN_DEFAULT, d.settings.gen || {});
  d.lastBackup = d.lastBackup || 0;
  return d;
}
const find = id => S.data && S.data.items.find(i => i.id === id);

function save() {
  if (!S.key) return saveChain;
  const key = S.key, salt = S.salt, iter = S.iter, wrapPw = S.wrapPw, bio = S.bio, snap = JSON.stringify(S.data);
  saveChain = saveChain.then(async () => {
    const { iv, ct } = await seal(key, snap);
    const env = { app:'kagibako', v:2, salt:b64(salt), iter, wrapPw, iv, ct, saved:Date.now() };
    if (bio) env.bio = bio;

  }).catch(e => {

/* ---------- トースト ---------- */
function toast(msg, { kind = '', sub = '', action = null, ms = 2600 } = {}) {
  const box = $('#toasts'), t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.innerHTML = `${ic(kind ? 'warn' : 'check')}<div class="t-msg"><b>${esc(msg)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>${action ? `<button class="t-act">${esc(action.label)}</button>` : ''}`;
  [...box.children].forEach(c => { if (c.dataset.msg === msg) c.remove(); });
  t.dataset.msg = msg;
  box.append(t);
  while (box.children.length > 2) box.firstElementChild.remove();
  let done = false;
  const kill = () => { if (done) return; done = true; t.classList.add('out'); setTimeout(() => t.remove(), 250); };
  if (action) t.querySelector('.t-act').onclick = () => { action.fn(); kill(); };
  setTimeout(kill, action ? 6000 : ms);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('in')));
  return kill;
}

let dlg = null;
function dialogBase({ title, message = '', buttons, input = null, error = '' }) {
  return new Promise(res => {
    if (dlg) dlg.finish(dlg.cancel);
    const d = $('#dialog'), prevFocus = document.activeElement;
    const inHTML = !input ? '' : input.type === 'password'
      ? `<span class="pw-wrap"><input id="dlgIn" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" class="eye" data-eye="dlgIn" aria-label="表示する">${ic('eye')}</button></span>`
      : `<input id="dlgIn" class="inp" type="text" placeholder="${esc(input.placeholder || '')}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
    d.innerHTML = `<div class="dlg-backdrop"></div><div class="dlg-panel" role="alertdialog" aria-modal="true" aria-labelledby="dlgT"><h3 id="dlgT">${esc(title)}</h3>${message ? `<p>${message}</p>` : ''}${inHTML}${input ? `<p class="err" id="dlgErr">${esc(error)}</p>` : ''}<div class="dlg-btns">${buttons.map((b, i) => `<button class="btn ${b.kind || 'ghost'}" data-i="${i}">${esc(b.label)}</button>`).join('')}</div></div>`;
    d.hidden = false;
    const cancel = input ? null : (buttons.find(b => b.cancel) || buttons[0]).value;
    const finish = v => { if (!dlg) return; dlg = null; d.hidden = true; d.innerHTML = ''; if (prevFocus && prevFocus.focus && document.contains(prevFocus)) prevFocus.focus({ preventScroll:true }); res(v); };
    dlg = { finish, cancel };
    const inp = $('#dlgIn', d);
    $$('[data-i]', d).forEach(btn => btn.onclick = () => {
      const b = buttons[+btn.dataset.i];
      if (input && b.ok) {
        const er = input.validate ? input.validate(inp.value) : '';
        if (er) { $('#dlgErr', d).textContent = er; inp.classList.add('shake'); setTimeout(() => inp.classList.remove('shake'), 400); inp.focus(); return; }
        finish(inp.value);
      } else finish(input ? null : b.value);
    });
    $('.dlg-backdrop', d).onclick = () => finish(cancel);
    if (inp) {
      inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $$('[data-i]', d)[buttons.findIndex(b => b.ok)].click(); } });
      setTimeout(() => inp.focus(), 60);
    } else setTimeout(() => $$('[data-i]', d).pop().focus(), 30);
  });
}
const ask = o => dialogBase(o);
const askInput = ({ title, message, type, placeholder, okLabel = 'OK', okKind = 'primary', validate, error }) =>
  dialogBase({ title, message, error, input: { type, placeholder, validate }, buttons: [{ label:'やめる' }, { label: okLabel, kind: okKind, ok: true }] });
const confirmDiscard = () => ask({ title:'入力した内容を捨てますか？', buttons:[{ label:'編集を続ける', value:false, cancel:true }, { label:'捨てる', value:true, kind:'primary danger' }] });

/* ---------- ファイルの受け渡し ---------- */
function pick(accept) {
  return new Promise(res => {
    S.hold++;
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept;
    let done = false;
    const safety = setTimeout(() => fin(null), 180000);
    function fin(f) { if (done) return; done = true; clearTimeout(safety); S.hold = Math.max(0, S.hold - 1); lastAct = Date.now(); res(f); }
    i.onchange = () => fin(i.files && i.files[0] || null);
    i.addEventListener('cancel', () => fin(null));
    i.click();
  });
}
async function deliver(blob, name, title) {
  S.hold++;
  try {
    const file = new File([blob], name, { type: blob.type });
    if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({ files:[file] })) {
      try { await navigator.share({ files:[file], title }); return true; }
      catch (e) { if (e && e.name === 'AbortError') return false; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    return true;
  } finally { S.hold = Math.max(0, S.hold - 1); lastAct = Date.now(); }
}

/* ---------- コピー ---------- */
function legacyCopy(text) {
  const t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', '');
  t.style.cssText = 'position:fixed;top:-100px;opacity:0'; document.body.append(t); t.select();
  let ok = false; try { ok = document.execCommand('copy'); } catch {} t.remove(); return ok;
}
async function clearClip() {
  clearTimeout(clipTimer); clipTimer = null;
  if (!clipPending) return;
  clipPending = false;
  try { await navigator.clipboard.writeText(''); } catch { legacyCopy(' '); }
}
async function copyText(text, label, item, btn) {
  if (!text) { toast(`${label}が登録されていません`, { kind:'warn' }); return; }
  let ok = true;
  try { await navigator.clipboard.writeText(text); } catch { ok = legacyCopy(text); }
  if (!ok) { toast('コピーできませんでした', { kind:'error' }); return; }
  if (navigator.vibrate) navigator.vibrate(12);
  if (btn) {
    const svg = btn.querySelector('svg');
    if (svg && !btn.classList.contains('done')) {
      const orig = svg.outerHTML; svg.outerHTML = ic('check'); btn.classList.add('done');
      setTimeout(() => { const s = btn.querySelector('svg'); if (s) s.outerHTML = orig; btn.classList.remove('done'); }, 1300);
    }
  }
  if (item) { item.used = Date.now(); item.count = (item.count || 0) + 1; save(); }
  const sec = S.data ? S.data.settings.clip : 30;
  clearTimeout(clipTimer); clipPending = true;
  if (sec > 0) clipTimer = setTimeout(clearClip, sec * 1000);
  toast(`${label}をコピーしました`, { sub: sec > 0 ? `${sec}秒後にクリップボードから消します` : '' });
}

function setVault(o) { S.key = o.dek; S.salt = o.salt; S.iter = o.iter; S.wrapPw = o.wrapPw; S.bio = o.bio || null; S.data = withDefaults(o.data); }

function getFails() { try { return JSON.parse(localStorage.getItem(FAILS)) || { n:0, until:0 }; } catch { return { n:0, until:0 }; } }

function reviewInfo() {
  const byPw = new Map();
  for (const i of S.data.items) if (i.pass) byPw.set(i.pass, (byPw.get(i.pass) || 0) + 1);
  const why = new Map();
  for (const i of S.data.items) {
    if (!i.pass) continue;
    const r = [];
    if (byPw.get(i.pass) > 1) r.push('使い回し');
    if (strength(i.pass).score <= 1) r.push('弱い');
    if (r.length) why.set(i.id, r);
  }
  return { byPw, why };
}
function renderBanner() {
  const b = $('#banner'); if (!b) return;
  const d = S.data, now = Date.now();
  const due = d.items.length > 0 && (!d.lastBackup || now - d.lastBackup > 30 * DAY) && now > (d.settings.snooze || 0);
  b.innerHTML = !due ? '' : `<div class="banner">${ic('shield')}<p>${d.lastBackup ? `最後のバックアップから${daysSince(d.lastBackup)}日たちました。` : 'まだバックアップがありません。'}この端末をなくしたり壊したりすると、元に戻せません。</p><div><button class="btn sm ghost" data-b="later">あとで</button><button class="btn sm primary" data-b="save">バックアップする</button></div></div>`;
}
function renderList() {
  if (!S.data || !$('#listWrap')) return;
  const items = S.data.items, rv = reviewInfo(), sort = S.data.settings.sort;
  $('#count').textContent = items.length ? `${items.length}件` : '';
  $('#searchrow').hidden = !items.length;
  $('#add').hidden = !items.length;
  $('#sortBtn span').textContent = sort === 'name' ? '名前順' : '最近順';
  // 絞り込みチップ
  const cats = [...new Set(items.map(i => i.cat).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'ja'));
  if (S.filter.startsWith('cat:') && !cats.includes(S.filter.slice(4))) S.filter = 'all';
  const chips = [['all', 'すべて', items.length, ''], ['fav', 'お気に入り', items.filter(i => i.fav).length, 'fav'], ['review', '見直し', rv.why.size, 'review'], ...cats.map(c => ['cat:' + c, c, items.filter(i => i.cat === c).length, ''])];
  $('#chips').hidden = !items.length;
  $('#chips').innerHTML = chips.filter(([k, , n]) => k === 'all' || n > 0 || S.filter === k)
    .map(([k, l, n, cls]) => `<button class="chip ${cls} ${S.filter === k ? 'on' : ''}" data-f="${esc(k)}" aria-pressed="${S.filter === k}">${cls === 'fav' ? ic('star', 'fill') : cls === 'review' ? ic('warn') : ''}${esc(l)}<i>${n}</i></button>`).join('');
  renderBanner();
  // 絞り込み・検索
  let list = items;
  if (S.filter === 'fav') list = list.filter(i => i.fav);
  else if (S.filter === 'review') list = list.filter(i => rv.why.has(i.id));
  else if (S.filter.startsWith('cat:')) list = list.filter(i => i.cat === S.filter.slice(4));
  const terms = norm(S.q).split(/\s+/).filter(Boolean);
  if (terms.length) list = list.filter(i => { const h = norm([i.title, i.url, i.user, i.note, i.cat].join(' ')); return terms.every(t => h.includes(t)); });
  list = [...list].sort(sort === 'name' ? (a, b) => a.title.localeCompare(b.title, 'ja') : (a, b) => (b.used || b.updated || 0) - (a.used || a.updated || 0));
  const w = $('#listWrap');
  if (!items.length) {
    w.innerHTML = `<div class="empty"><div class="emblem">${EMBLEM}</div><h2>まだ何も入っていません</h2><p>よく使うサイトから登録していきましょう。ブラウザに保存しているパスワードは、CSVに書き出してまとめて取り込めます。</p><div class="btns"><button class="btn primary big" data-act="new">${ic('plus')}最初のパスワードを登録</button><button class="btn ghost" data-act="import">${ic('upload')}CSVを取り込む</button></div>${isStandalone() ? '' : '<p class="tip">ブラウザのメニューから「ホーム画面に追加」すると、アプリのように開けます。</p>'}</div>`;
    return;
  }
  if (!list.length) {
    w.innerHTML = `<div class="nohit">${S.q ? `「${esc(S.q)}」に当てはまるものはありません。` : 'ここに当てはまるものはありません。'}${S.q ? `<br><button class="btn ghost" data-act="new">${ic('plus')}「${esc(S.q.trim())}」として登録する</button>` : ''}</div>`;
    return;
  }
  w.innerHTML = `<ul class="list">${list.map(i => {
    const why = rv.why.get(i.id);
    return `<li class="row" data-id="${esc(i.id)}">
      <button class="row-main" data-act="open"><span class="av" style="--h:${hue(i.title)}">${esc(initial(i.title))}</span><span class="row-text"><b><span style="overflow:hidden;text-overflow:ellipsis">${esc(i.title)}</span>${i.fav ? ic('star', 'fill') : ''}</b><small>${i.user ? esc(i.user) : 'IDなし'}</small>${S.filter === 'review' && why ? `<span class="why">${why.map(x => `<span>${x}</span>`).join('')}</span>` : ''}</span></button>
      <button class="cp" data-act="cpuser" aria-label="${esc(i.title)}のIDをコピー">${ic('user')}ID</button>
      <button class="cp pw" data-act="cppass" aria-label="${esc(i.title)}のパスワードをコピー">${ic('key')}PW</button>
    </li>`; }).join('')}</ul>`;
}
function flashRow(id) {
  const r = $(`.row[data-id="${CSS.escape(id)}"]`); if (!r) return;
  r.classList.remove('flash'); void r.offsetWidth; r.classList.add('flash');
  r.scrollIntoView({ block:'nearest', behavior: reduced ? 'auto' : 'smooth' });
}

    ${it.note ? `<div class="note-box"><div class="fk">メモ<button class="mini-copy" data-copy="note">コピー</button></div><p>${esc(it.note)}</p></div>` : ''}
    <p class="meta">${it.cat ? `<span class="tag">${esc(it.cat)}</span>` : ''}<span>更新 ${fmtDate(it.updated)}</span>${it.count ? `<span>コピー ${it.count}回</span>` : ''}</p>
    ${hist.length ? `<details class="hist"><summary>以前のパスワード（${hist.length}件）</summary>${hist.map((h, n) => `<div class="hrow"><code class="pwc">${pwHTML(h.pass)}</code><small>${fmtDate(h.date)}まで</small><button class="mini-copy" data-hcopy="${n}">コピー</button></div>`).join('')}</details>` : ''}

    const labels = { user:'ID', pass:'パスワード', note:'メモ' };

    $$('[data-hcopy]', body).forEach(b => b.onclick = () => copyText(hist[+b.dataset.hcopy].pass, '以前のパスワード', null, b));
    const eye = $('#dEye', body);
    if (eye) {
      let shown = false, t = null;
      eye.onclick = () => {

    $('#dEdit', body).onclick = () => openEdit(it.id);

      if (!ok || !S.data) return;
      const idx = S.data.items.indexOf(it); if (idx < 0) return;
      S.data.items.splice(idx, 1); save(); closeSheet(); renderList();
      toast('削除しました', { action:{ label:'元に戻す', fn: () => { if (!S.data) return; S.data.items.splice(Math.min(idx, S.data.items.length), 0, it); save(); renderList(); flashRow(it.id); } } });
    };
  });
}

    <div class="d-head"><h2 class="e-title">${it ? '編集' : '新しく登録'}</h2><button class="icon-btn" data-sheet-close aria-label="閉じる">${ic('close')}</button></div>

      <label class="field"><span class="field-label">URL</span><input class="inp" id="fUrl" type="url" inputmode="url" value="${esc(v.url)}" placeholder="例：amazon.co.jp" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next"></label>
      <label class="field"><span class="field-label">ID・メールアドレス</span><input class="inp" id="fUser" value="${esc(v.user)}" list="dlUsers" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="next"></label>
      <datalist id="dlUsers">${users.map(u => `<option value="${esc(u)}"></option>`).join('')}</datalist>
      <div class="field"><label class="field-label" for="fPass">パスワード</label>

        ${meterHTML('fMeter', 'sm')}

          <div class="gen-out pwc" id="genOut" aria-live="polite"></div>

          <div class="gen-opts">${[['upper', 'ABC'], ['lower', 'abc'], ['digit', '123'], ['symbol', '!#%'], ['noAmb', '見まちがえやすい文字なし']].map(([k, l]) => `<label class="opt"><input type="checkbox" data-g="${k}" ${g[k] ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>
          <p class="gen-help">記号が使えないサイトでは「!#%」を外してください。</p>
          <div class="gen-actions"><button type="button" class="btn ghost" id="genAgain">${ic('refresh')}ほかの候補</button><button type="button" class="btn primary" id="genUse">これを使う</button></div>
        </div>
      </div>
      <div class="field"><label class="field-label" for="fCat">カテゴリ</label><input class="inp" id="fCat" value="${esc(v.cat)}" placeholder="選ぶか、自由に入力" autocomplete="off">
        <div class="catpick">${catChoices.map(c => `<button type="button" class="chip sm ${c === v.cat ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>
      <label class="field"><span class="field-label">メモ</span><textarea class="inp" id="fNote" rows="3" placeholder="秘密の質問の答え、暗証番号の手がかりなど">${esc(v.note)}</textarea></label>
      <label class="switch"><input type="checkbox" id="fFav" ${v.fav ? 'checked' : ''}><span class="sw"></span>お気に入りに入れる</label>

    <div class="d-actions"><button class="btn ghost" id="eCancel">やめる</button><button class="btn primary" id="eSave">${ic('check')}保存する</button></div>`, body => {
    const f = x => $('#' + x, body);
    const tI = f('fTitle'), uI = f('fUrl'), usI = f('fUser'), pI = f('fPass'), cI = f('fCat'), nI = f('fNote'), favI = f('fFav');
    const snap = () => JSON.stringify([tI.value, uI.value, usI.value, pI.value, cI.value, nI.value, favI.checked]);
    const initialSnap = snap();
    sheetGuard = () => snap() !== initialSnap;
    const upd = () => {
      setMeter(f('fMeter'), pI.value);
      const n = pI.value ? S.data.items.filter(x => x !== it && x.pass === pI.value).length : 0;
      const r = f('fReuse'); r.hidden = !n;
      r.innerHTML = n ? `${ic('warn')}<span>ほかの${n}件と同じパスワードです。サイトごとに変えると安全です。</span>` : '';
    };
    pI.addEventListener('input', upd); upd();
    tI.addEventListener('input', () => tI.classList.remove('invalid'));
    uI.addEventListener('blur', () => { if (!tI.value.trim() && uI.value.trim()) { const n = nameFromUrl(uI.value); if (n) tI.value = n; } });
    [tI, uI, usI].forEach((el, n, arr) => el.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); (arr[n + 1] || pI).focus(); } }));
    const syncCat = () => $$('[data-cat]', body).forEach(x => x.classList.toggle('on', x.dataset.cat === cI.value.trim()));
    $$('[data-cat]', body).forEach(b => b.onclick = () => { cI.value = cI.value.trim() === b.dataset.cat ? '' : b.dataset.cat; syncCat(); });
    cI.addEventListener('input', syncCat);
    // パスワードを作る
    const gen = f('gen'), out = f('genOut'); let cur = '';
    const regen = () => { cur = generate(g); out.innerHTML = pwHTML(cur); f('genLenV').textContent = g.len; };
    f('genToggle').onclick = () => {
      gen.hidden = !gen.hidden; f('genToggle').setAttribute('aria-expanded', String(!gen.hidden));

    };
    f('genLen').oninput = e => { g.len = +e.target.value; regen(); };
    $$('[data-g]', body).forEach(c => c.onchange = () => {
      g[c.dataset.g] = c.checked;
      if (!['upper', 'lower', 'digit', 'symbol'].some(k => g[k])) { g.lower = true; $('[data-g="lower"]', body).checked = true; }
      regen();
    });
    f('genAgain').onclick = regen;
    f('genUse').onclick = () => {
      pI.value = cur; pI.type = 'text';
      const eb = $('[data-eye="fPass"]', body); eb.innerHTML = ic('eyeoff'); eb.setAttribute('aria-label', '隠す');
      gen.hidden = true; f('genToggle').setAttribute('aria-expanded', 'false'); upd();
    };
    f('eCancel').onclick = async () => {
      if (snap() !== initialSnap && !(await confirmDiscard())) return;
      sheetGuard = null;
      if (it) openDetail(it.id); else closeSheet();
    };
    f('eSave').onclick = async () => {
      const title = tI.value.trim();
      if (!title) { tI.classList.add('invalid'); tI.focus(); toast('サイト・サービス名を入れてください', { kind:'warn' }); return; }
      let url = uI.value.trim();
      if (url && !/^[a-z][a-z0-9+.-]*:/i.test(url) && url.includes('.')) url = 'https://' + url;
      const now = Date.now(), pass = pI.value;
      const vals = { title, url, user: usI.value.trim(), pass, cat: cI.value.trim(), note: nI.value.replace(/\s+$/, ''), fav: favI.checked };
      let target = it;
      if (it) {
        if (it.pass && it.pass !== pass) { it.history = [{ pass: it.pass, date: now }, ...(it.history || [])].slice(0, 5); it.changed = now; }
        else if (!it.pass && pass) it.changed = now;
        Object.assign(it, vals, { updated: now });
      } else {
        target = { id: uid(), ...vals, created: now, updated: now, changed: now, used: now, count: 0, history: [] };
        S.data.items.push(target);
      }
      sheetGuard = null;
      await save(); renderList();
      if (it) { openDetail(it.id); toast('保存しました'); }
      else { closeSheet(); toast('登録しました'); setTimeout(() => flashRow(target.id), 120); }
    };
    if (!it) setTimeout(() => (tI.value ? usI : tI).focus(), 320);
  });
}

      <ul class="facts">
        <li>中身はマスターパスワードから作った鍵（PBKDF2・60万回）でAES-256暗号化し、この端末のブラウザの中にだけ保存しています。</li>
        <li>指紋・顔認証をオンにすると、端末のパスキーから作った別の鍵でも同じ金庫の鍵を包みます。指紋や顔の情報がアプリに渡ることはありません。</li>
        <li>通信は一切しません。外への送信はページの設定（CSP）で止めています。</li>
        <li>ブラウザの「サイトデータを削除」をすると中身も消えます。バックアップを忘れずに。</li>
      </ul>
      <p class="set-note">登録 ${S.data.items.length}件　保存サイズ 約${size}KB</p>
    </section>
    <section class="set"><button class="set-row danger" id="sWipe">${ic('trash')}<span>この端末からすべて消す</span></button></section>
    <div class="sheet-end"></div>`, body => {
    $$('.seg', body).forEach(sg => sg.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      S.data.settings[sg.dataset.seg] = +b.dataset.v;
      $$('button', sg).forEach(x => { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', String(x === b)); });
      save();
    });
    $('#sChange', body).onclick = openChangeMaster;
    renderBioRow(body);
    $('#sBackup', body).onclick = async () => { if (await exportBackup()) openSettings(); };
    $('#sRestore', body).onclick = importBackup;
    $('#sCsvIn', body).onclick = importCSV;
    $('#sCsvOut', body).onclick = exportCSV;
    $('#sWipe', body).onclick = async () => {
      const t = await askInput({ title:'この端末からすべて消しますか？', message:`登録している${S.data.items.length}件がすべて消え、元に戻せません。よければ「削除」と入力してください。`, placeholder:'削除', okLabel:'すべて消す', okKind:'primary danger', validate: v => v.trim() === '削除' ? '' : '「削除」と入力してください' });
      if (t != null) wipe();
    };
  });
}

/* ---------- 指紋・顔認証の設定 ---------- */
async function renderBioRow(body) {
  const row = $('#bioRow', body); if (!row) return;
  const ok = await bioSupported();
  if (!document.contains(row) || !S.data) return;
  const on = !!S.bio && S.bio.rpId === location.hostname;
  const sub = on ? `オン（${fmtDate(S.bio.created)}に登録）` : ok ? 'マスターパスワードを入れずに開けます' : 'この端末・ブラウザでは使えません';
  row.innerHTML = `<label class="switch set-switch">${ic('finger')}<span class="sw-text">指紋・顔認証で開く<small>${sub}</small></span><input type="checkbox" id="sBio" ${on ? 'checked' : ''} ${ok || on ? '' : 'disabled'}><span class="sw"></span></label>`;
  $('#sBio', row).onchange = async e => {
    const cb = e.target; cb.disabled = true;
    if (cb.checked) await enableBio(false); else await disableBio();
    if (!S.data) return;
    if (document.contains(row)) renderBioRow(body);
  };
}
async function verifyMaster(title) {
  let error = '';
  for (;;) {
    const pw = await askInput({ title, message:'確認のため、マスターパスワードを入れてください。', type:'password', okLabel:'次へ', error });
    if (pw == null) return false;
    if (await checkPw(pw)) return true;
    error = 'マスターパスワードが違います';
  }
}
async function checkPw(pw) {
  try { const k = await deriveKey(pw, S.salt, S.iter); await unsealBytes(k, S.wrapPw.iv, S.wrapPw.ct); return true; } catch { return false; }
}
async function enableBio(skipVerify) {
  if (!S.key) return false;
  if (!skipVerify && !(await verifyMaster('指紋・顔認証をオンにします'))) return false;
  if (!S.data.settings.bioUid) S.data.settings.bioUid = b64(rand(16));
  S.hold++;
  try {
    S.bio = await bioEnroll(S.key, unb64(S.data.settings.bioUid));
    await save();
    toast('指紋・顔認証で開けるようにしました', { sub:'次にロックを外すときから使えます' });
    return true;
  } catch (e) {
    console.warn(e);
    if (e && (e.name === 'NotAllowedError' || e.name === 'AbortError')) toast('設定をやめました', { kind:'warn' });
    else if (e && e.name === 'PrfUnsupported') await ask({ title:'この端末では使えません', message:'このブラウザは、指紋・顔認証から暗号の鍵を作る機能（PRF）に対応していません。Chromeを最新版にして、もう一度お試しください。', buttons:[{ label:'閉じる', value:true, kind:'primary' }] });
    else if (e && e.name === 'SecurityError') await ask({ title:'このアドレスでは使えません', message:'指紋・顔認証は https のページ（GitHub Pages など）で使えます。', buttons:[{ label:'閉じる', value:true, kind:'primary' }] });
    else toast('設定できませんでした', { kind:'error', sub: `${e && e.name}: ${e && e.message}` });
    return false;
  } finally { S.hold = Math.max(0, S.hold - 1); lastAct = Date.now(); }
}
async function disableBio() {
  const ok = await ask({ title:'指紋・顔認証をオフにしますか？', message:'これからはマスターパスワードで開きます。Googleパスワードマネージャーに残るパスキー「かぎ箱」は、不要なら削除してかまいません。', buttons:[{ label:'やめる', value:false, cancel:true }, { label:'オフにする', value:true, kind:'primary danger' }] });
  if (!ok || !S.data) return false;
  S.bio = null; await save(); toast('指紋・顔認証をオフにしました');
  return true;
}
async function offerBio() {
  if (!(await bioSupported()) || !S.key || S.bio) return;
  const y = await ask({ title:'指紋・顔認証でも開けるようにしますか？', message:'毎回マスターパスワードを入れなくても、指紋や顔で開けるようになります。<br><br><b>マスターパスワードは機種変更やバックアップの復元で必要になるので、忘れないようにしてください。</b>', buttons:[{ label:'あとで', value:false, cancel:true }, { label:'設定する', value:true, kind:'primary' }] });
  if (y) enableBio(true);
}

function openChangeMaster() {
  openSheet(`
    <div class="d-head"><h2 class="e-title">マスターパスワードを変える</h2><button class="icon-btn" data-sheet-close aria-label="閉じる">${ic('close')}</button></div>
    <div class="form">
      ${pwField('c0', '今のマスターパスワード')}
      ${pwField('c1', '新しいマスターパスワード', '8文字以上', 'new-password')}
      ${meterHTML('c1m', 'sm')}
      ${pwField('c2', '新しいものを、もう一度', '', 'new-password')}
      <p class="err" id="cErr" role="alert"></p>
      <p class="set-note">変えたあとも、これまでに保存したバックアップは、そのときのマスターパスワードで開きます。変えたら新しくバックアップを保存しておくと安心です。</p>
    </div>
    <div class="d-actions"><button class="btn ghost" id="cBack">戻る</button><button class="btn primary" id="cGo">変更する</button></div>`, body => {
    const c0 = $('#c0', body), c1 = $('#c1', body), c2 = $('#c2', body), err = $('#cErr', body);
    sheetGuard = () => !!(c0.value || c1.value || c2.value);
    c1.addEventListener('input', () => setMeter($('#c1m', body), c1.value));
    $('#cBack', body).onclick = () => { sheetGuard = null; openSettings(); };
    $('#cGo', body).onclick = async () => {
      err.textContent = '';
      if (c1.value.length < 8) { err.textContent = '新しいマスターパスワードは8文字以上にしてください'; c1.focus(); return; }
      if (c1.value !== c2.value) { err.textContent = '新しいマスターパスワードが2回とも同じになっていません'; c2.focus(); return; }
      const btn = $('#cGo', body); btn.disabled = true; btn.textContent = '確かめています…';
      try {
        await saveChain;
        await openWithPassword(loadEnv(), c0.value);
      } catch { err.textContent = '今のマスターパスワードが違います'; btn.disabled = false; btn.textContent = '変更する'; c0.select(); return; }
      btn.textContent = '変えています…';
      const w = await wrapWithPassword(c1.value, S.key);
      S.salt = w.salt; S.iter = w.iter; S.wrapPw = w.wrapPw;
      await save();
      sheetGuard = null; openSettings();
      toast('マスターパスワードを変えました', { sub:'新しくバックアップを保存しておくと安心です' });
    };
  });
}

/* =========================================================
   バックアップ
   ========================================================= */
async function exportBackup() {
  if (!S.key) return false;
  const { iv, ct } = await seal(S.key, JSON.stringify(S.data));
  const env = { app:'kagibako', kind:'backup', v:2, salt:b64(S.salt), iter:S.iter, wrapPw:S.wrapPw, iv, ct, exported:new Date().toISOString(), count:S.data.items.length };
  const ok = await deliver(new Blob([JSON.stringify(env)], { type:'application/json' }), `kagibako-backup-${ymd()}.json`, 'かぎ箱のバックアップ');
  if (!ok || !S.data) return false;
  S.data.lastBackup = Date.now(); S.data.settings.snooze = 0; save(); renderBanner();
  toast('バックアップを保存しました', { sub:'Googleドライブなど、この端末以外の場所にも置いておきましょう' });
  return true;
}
async function openBackupEnv(env) {
  let error = '';
  for (;;) {
    const when = env.exported ? `${fmtDate(Date.parse(env.exported))}に保存した${env.count != null ? `${env.count}件の` : ''}バックアップです。` : '';
    const pw = await askInput({ title:'バックアップを開きます', message:`${esc(when)}保存したときのマスターパスワードを入れてください。`, type:'password', okLabel:'開ける', error });
    if (pw == null) return null;
    try {
      const o = await openWithPassword(env, pw);
      o.data = withDefaults(o.data);
      o.data.lastBackup = Math.max(o.data.lastBackup || 0, Date.parse(env.exported) || 0);
      return o;
    } catch { error = 'マスターパスワードが違います'; }
  }
}
async function importBackup() {
  const file = await pick('.json,application/json');
  if (!file) return;
  let env;
  try { env = JSON.parse(await file.text()); if (env.app !== 'kagibako' || !env.ct || !env.salt) throw 0; }
  catch { await ask({ title:'読み込めませんでした', message:'かぎ箱のバックアップファイル（kagibako-backup-….json）を選んでください。', buttons:[{ label:'閉じる', value:true, kind:'primary' }] }); return; }
  const opened = await openBackupEnv(env); if (!opened) return;
  if (!S.key) {
    // はじめての端末：バックアップをそのまま金庫にする
    setVault({ ...opened, bio: null });
    await save();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    enterMain();
    toast(`${S.data.items.length}件を復元しました`, { sub:'これからはバックアップしたときのマスターパスワードで開きます' });
    offerBio();
    return;
  }
  const incoming = opened.data.items;
  const mode = await ask({ title:`${incoming.length}件のバックアップを開きました`, message:'「合わせる」は両方の中身を残し、同じ項目は新しいほうを使います。「置き換える」は今の中身を捨ててバックアップの内容にします。', buttons:[{ label:'やめる', value:null, cancel:true }, { label:'置き換える', value:'replace', kind:'ghost danger' }, { label:'合わせる', value:'merge', kind:'primary' }] });
  if (!mode || !S.data) return;
  let added = 0, updated = 0;
  if (mode === 'replace') { S.data.items = incoming; added = incoming.length; }
  else {
    const map = new Map(S.data.items.map(i => [i.id, i]));
    for (const i of incoming) {
      const cur = map.get(i.id);
      if (!cur) { S.data.items.push(i); added++; }
      else if ((i.updated || 0) > (cur.updated || 0)) { Object.assign(cur, i); updated++; }
    }
  }
  await save(); renderList();
  if (sheetOpen) closeSheet();
  toast(mode === 'replace' ? `${added}件に置き換えました` : `${added}件を追加、${updated}件を更新しました`);
}

/* =========================================================
   CSV（ほかのアプリとの移行用）
   ========================================================= */
function parseCSV(text) {
  const rows = []; let row = [], f = '', q = false;
  text = text.replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
const CSVMAP = {
  title:['name','title','タイトル','名前','サイト名','サービス名'],
  url:['url','login_uri','website','web site','uri','ウェブサイト'],
  user:['username','login_username','user','user name','email','login','ユーザー名','ユーザ名','id','メールアドレス'],
  pass:['password','login_password','パスワード'],
  note:['note','notes','extra','comments','memo','メモ'],
  cat:['folder','grouping','category','group','カテゴリ','フォルダ']
};
async function importCSV() {
  const file = await pick('.csv,text/csv,text/comma-separated-values');
  if (!file || !S.key) return;
  const buf = await file.arrayBuffer();
  let text;
  try { text = new TextDecoder('utf-8', { fatal:true }).decode(buf); }
  catch { try { text = new TextDecoder('shift_jis').decode(buf); } catch { text = new TextDecoder().decode(buf); } }
  const rows = parseCSV(text);
  const fail = m => ask({ title:'取り込めませんでした', message:m, buttons:[{ label:'閉じる', value:true, kind:'primary' }] });
  if (rows.length < 2) return fail('CSVの中に項目が見つかりませんでした。');
  const head = rows[0].map(h => norm(h).trim());
  const col = {}; for (const k in CSVMAP) col[k] = head.findIndex(h => CSVMAP[k].includes(h));
  if (col.pass < 0) return fail('パスワードの列が見つかりませんでした。1行目に「password」などの見出しがあるCSVを選んでください。');
  const now = Date.now(), exist = new Set(S.data.items.map(i => [i.title, i.user, i.pass].join('\n')));
  let dup = 0; const add = [];
  for (const r of rows.slice(1)) {
    const g = k => col[k] >= 0 ? String(r[col[k]] || '').trim() : '';
    const pass = String(r[col.pass] || ''), url = g('url'), user = g('user');
    if (!pass && !user) continue;
    const title = g('title') || nameFromUrl(url) || user || '名前なし';
    const k = [title, user, pass].join('\n');
    if (exist.has(k)) { dup++; continue; }
    exist.add(k);
    add.push({ id: uid(), title, url, user, pass, cat: g('cat'), note: g('note'), fav:false, created:now, updated:now, changed:now, used:0, count:0, history:[] });
  }
  if (!add.length) return fail(dup ? `${dup}件はすべて登録済みでした。` : '取り込める項目がありませんでした。');
  const ok = await ask({ title:`${add.length}件を取り込みます`, message: dup ? `${dup}件はすでに登録済みなので除きました。` : '', buttons:[{ label:'やめる', value:false, cancel:true }, { label:'取り込む', value:true, kind:'primary' }] });
  if (!ok || !S.data) return;
  S.data.items.push(...add); await save();
  if (sheetOpen) closeSheet();
  S.filter = 'all'; renderList();
  await ask({ title:`${add.length}件を取り込みました`, message:'<b>元のCSVファイルは暗号化されていません。</b>ダウンロードフォルダなどから削除し、ゴミ箱も空にしておいてください。', buttons:[{ label:'わかりました', value:true, kind:'primary' }] });
}
async function exportCSV() {
  const ok = await ask({ title:'暗号化せずに書き出します', message:'CSVファイルは誰でも中身を読めます。ほかのパスワード管理アプリへ移すときだけ使い、取り込んだらすぐに削除してください。', buttons:[{ label:'やめる', value:false, cancel:true }, { label:'書き出す', value:true, kind:'primary danger' }] });
  if (!ok || !S.data) return;
  const cell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [['name', 'url', 'username', 'password', 'note'], ...S.data.items.map(i => [i.title, i.url, i.user, i.pass, i.note])].map(r => r.map(cell).join(','));
  if (await deliver(new Blob([lines.join('\r\n')], { type:'text/csv' }), `kagibako-${ymd()}.csv`, 'かぎ箱CSV')) toast('CSVを書き出しました', { kind:'warn', sub:'使い終わったら削除してください' });
}

/* =========================================================
   起動・自動ロック・全体の操作
   ========================================================= */
document.addEventListener('click', e => {
  const eye = e.target.closest('[data-eye]');
  if (eye) {
    const inp = document.getElementById(eye.dataset.eye); if (!inp) return;
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    eye.innerHTML = ic(show ? 'eyeoff' : 'eye'); eye.setAttribute('aria-label', show ? '隠す' : '表示する');
    return;
  }
  if (e.target.closest('[data-sheet-close]') || e.target.classList.contains('sheet-backdrop')) requestClose();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (dlg) { dlg.finish(dlg.cancel); return; }
    if (sheetOpen) { requestClose(); return; }
  }
  if (e.key === '/' && S.key && !sheetOpen && !dlg && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    const q = $('#q'); if (q && !q.closest('[hidden]')) { e.preventDefault(); q.focus(); }
  }
});
['pointerdown', 'keydown', 'input', 'wheel', 'touchstart'].forEach(t => addEventListener(t, () => { lastAct = Date.now(); }, { passive:true, capture:true }));
function checkIdle(auto) {
  if (!S.key || S.hold > 0) return;
  if (Date.now() - lastAct > S.data.settings.autolock * 60000) lock('しばらく操作がなかったのでロックしました。', auto);
}
setInterval(() => checkIdle(false), 5000);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (S.key && !S.hold) document.body.classList.add('veil'); }
  else { document.body.classList.remove('veil'); checkIdle(true); }
});

function boot() {
  setupHead();
  if (!window.crypto || !crypto.subtle) {
    $('#app').innerHTML = `<main class="gate"><div class="emblem">${EMBLEM}</div><h1 class="gate-title">かぎ箱</h1><p class="gate-lead">このページは https:// で始まるアドレス（GitHub Pages など）から開いてください。暗号化の機能が使えないため、ここでは動きません。</p></main>`;
    return;
  }
  loadEnv() ? showLock(null, true) : showSetup();
}
boot();
})();
